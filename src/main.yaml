substitutions:
  name: wb-led-esp32
  friendly_name: "wb-led"

  baud_rate: 115200
  # На одном RS-485 висят три WB-LED: четыре групповых чтения на каждый.
  # При меньшем интервале новый цикл попадает в незаконченный предыдущий.
  update_interval: "1800ms"
  command_throttle: "25ms"

  pulse_time: "300ms"
  debounce_on: "10ms"
  debounce_off: "10ms"
  single_max: "500ms"
  single_off: "300ms"
  long_min: "800ms"
  double_on: "400ms"
  double_off: "300ms"
  shortlong_on: "500ms"
  shortlong_off: "300ms"
  shortlong_long: "800ms"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# Enable logging
logger:
  level: INFO

api:
  id: api_id
  encryption:
    key: !secret api_key
  # Обычный таймаут API не сработает, если зависший клиент всё ещё числится
  # подключённым. Этот таймаут остаётся резервом для полного обрыва API.
  reboot_timeout: 3min
  on_client_connected:
    - logger.log:
        level: INFO
        format: "API client connected"
  on_client_disconnected:
    - logger.log:
        level: INFO
        format: "API client disconnected"

ota:
  - platform: esphome
    password: !secret ota_password


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Настройка UART
uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: ${baud_rate}
  stop_bits: 2

# Настройка Modbus
modbus:
  id: modbus_rs_485
  flow_control_pin: GPIO4  # DE/RE объединены на один пин
  # При 115200 бод ответ WB-LED приходит намного быстрее. Больший таймаут
  # блокирует общую шину и накапливает дублирующие запросы опроса.
  send_wait_time: 500ms
  # В ESPHome 2026.6.x значение по умолчанию стало 600 мс. Это пауза после
  # КАЖДОГО ответа на шине, из-за неё полный опрос трёх WB-LED не укладывается
  # в update_interval. 100 мс — прежнее значение ESPHome и достаточный запас.
  turnaround_time: 100ms

modbus_controller:
  - id: wb1
    address: 128
    modbus_id: modbus_rs_485
    update_interval: ${update_interval}
    command_throttle: ${command_throttle}

  - id: wb2
    address: 129
    modbus_id: modbus_rs_485
    update_interval: ${update_interval}
    command_throttle: ${command_throttle}

  - id: wb3
    address: 115
    modbus_id: modbus_rs_485
    update_interval: ${update_interval}
    command_throttle: ${command_throttle}

# Если ESP продолжает работать (в том числе опрашивает RS-485), но HA потерял
# подписку на состояния, автоматически перезагружаемся вместо зависания до
# ручного снятия питания. Лог-клиент ESPHome сам по себе не считается подпиской.
interval:
  - interval: 30s
    then:
      - lambda: |-
          static uint8_t api_without_ha_checks = 0;
          if (id(api_id).is_connected_with_state_subscription()) {
            api_without_ha_checks = 0;
            return;
          }

          if (++api_without_ha_checks >= 6) {
            ESP_LOGE("api_watchdog", "HA state subscription absent for 3 minutes; rebooting");
            App.reboot();
          }
